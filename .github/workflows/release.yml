name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motion-take-studio-release
  cancel-in-progress: false

jobs:

  # Validate Repository Configuration
  config:
    runs-on: ubuntu-latest
    outputs:
      config_package: ${{ steps.config_package.outputs.configPackage }}
    steps:

    - name: Require main branch
      run: |
        if [ "$GITHUB_REF" != "refs/heads/main" ]; then
          echo "Releases may only be dispatched from main."
          exit 1
        fi

    # Ensure that required repository variable has been created for the Package
    - name: Validate Package Config
      id: config_package
      run: |
        if [ "${{ vars.PACKAGE_NAME }}" != "" ]; then
          echo "configPackage=true" >> $GITHUB_OUTPUT;
        else
          echo "configPackage=false" >> $GITHUB_OUTPUT;
        fi

  # Reuse only the exact protected-main push run and revalidate its NUnit XML.
  verify-unity-ci:
    needs: config
    if: needs.config.outputs.config_package == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify exact-SHA main Unity CI evidence
        id: evidence
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $evidence = ./.github/scripts/Resolve-UnityCiEvidence.ps1 `
            -CommitSha $env:GITHUB_SHA
          "run_id=$($evidence.RunId)" | Out-File `
            -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download verified Unity CI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unity-tests-${{ github.sha }}
          path: artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.evidence.outputs.run_id }}

      - name: Validate EditMode NUnit XML
        shell: pwsh
        run: >-
          ./Packages/com.buildsoft.motion-take-studio/Tools~/Run-MotionTakeStudioTests.ps1
          -ValidateResultsOnly
          -ValidationMode EditMode
          -ResultPath artifacts/editmode-results.xml

      - name: Validate PlayMode NUnit XML
        shell: pwsh
        run: >-
          ./Packages/com.buildsoft.motion-take-studio/Tools~/Run-MotionTakeStudioTests.ps1
          -ValidateResultsOnly
          -ValidationMode PlayMode
          -ResultPath artifacts/playmode-results.xml

  # Build and release the Package
  # If the repository is not configured properly, this job will be skipped
  build:
    needs:
      - config
      - verify-unity-ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      packagePath: Packages/${{ vars.PACKAGE_NAME }}
    if: needs.config.outputs.config_package == 'true' && github.ref == 'refs/heads/main'
    steps:

      # Checkout Local Repository
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      # Get the Package version based on the package.json file
      - name: Get Version
        id: version
        uses: zoexx/github-action-json-file-properties@42c424cc2a0f9dfd36c79aedb70d429c0ae3e3fa
        with: 
            file_path: "${{ env.packagePath }}/package.json"
            prop_path: "version"
    
      # Configure the Environment Variables needed for releasing the Package
      - name: Set Environment Variables
        run: |
          echo "zipFile=${{ vars.PACKAGE_NAME }}-${{ steps.version.outputs.value }}".zip >> $GITHUB_ENV
          echo "unityPackage=${{ vars.PACKAGE_NAME }}-${{ steps.version.outputs.value }}.unitypackage" >> $GITHUB_ENV
          echo "version=${{ steps.version.outputs.value }}" >> $GITHUB_ENV

      # Zip the Package for release
      - name: Create Package Zip
        working-directory: "${{ env.packagePath }}"
        run: zip -r "${{ github.workspace }}/${{ env.zipFile }}" .
      
      # Build a list of .meta files for future use
      - name: Track Package Meta Files
        run: find "${{ env.packagePath }}/" -name \*.meta >> metaList
      
      # Make a UnityPackage version of the Package for release
      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@b5c57408698b1fab8b3a84d4b67f767b8b7c0be9 # v1.2.3
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metaList
      
      # Make a release tag of the version from the package.json file 
      - name: Create Tag
        id: tag_version
        uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72
        with:
          tag: "${{ env.version }}"
      
      # Publish the Release to GitHub
      - name: Make Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            ${{ env.zipFile }}
            ${{ env.unityPackage }}
            ${{ env.packagePath }}/package.json
          tag_name: ${{ env.version }}
