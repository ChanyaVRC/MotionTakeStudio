name: Unity Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: CI Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Test runner contract
        shell: pwsh
        run: >-
          ./Packages/com.buildsoft.motion-take-studio/Tools~/Run-MotionTakeStudioTests.ps1
          -SelfTest

      - name: Test Unity Build Automation client
        shell: pwsh
        run: >-
          ./Packages/com.buildsoft.motion-take-studio/Tools~/Tests/Test-UnityBuildAutomationClient.ps1
          -RepositoryRoot .

      - name: Test workflow contract
        shell: pwsh
        run: >-
          ./Packages/com.buildsoft.motion-take-studio/Tools~/Tests/Test-UnityCiContract.ps1
          -RepositoryRoot .

      - name: Test Pages workflow security contract
        shell: pwsh
        run: >-
          ./Packages/com.buildsoft.motion-take-studio/Tools~/Tests/Test-PagesWorkflowContract.ps1
          -RepositoryRoot .
          -SelfTest

  # The UBA service-account credentials never reach pull-request code. This lane
  # runs only after review on protected main, and again before a release.
  unity:
    name: Unity EditMode + PlayMode
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    concurrency:
      group: motion-take-studio-unity-build-automation
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: unity-ci
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Run Unity Build Automation tests without VRChat SDK or NDMF
        id: unity_test
        shell: pwsh
        env:
          UNITY_UBA_KEY_ID: ${{ secrets.UNITY_UBA_KEY_ID }}
          UNITY_UBA_SECRET_KEY: ${{ secrets.UNITY_UBA_SECRET_KEY }}
          UNITY_UBA_ORG_ID: ${{ vars.UNITY_UBA_ORG_ID }}
          UNITY_UBA_PROJECT_ID: ${{ vars.UNITY_UBA_PROJECT_ID }}
          UNITY_UBA_BUILD_TARGET_ID: ${{ vars.UNITY_UBA_BUILD_TARGET_ID }}
          UNITY_VERSION: 2022.3.40f1
        run: >-
          ./.github/scripts/Invoke-UnityBuildAutomation.ps1
          -OrganizationId $env:UNITY_UBA_ORG_ID
          -ProjectId $env:UNITY_UBA_PROJECT_ID
          -BuildTargetId $env:UNITY_UBA_BUILD_TARGET_ID
          -CommitSha $env:GITHUB_SHA
          -Branch $env:GITHUB_REF_NAME
          -ExpectedUnityVersion $env:UNITY_VERSION
          -OutputDirectory artifacts

      - name: Validate EditMode NUnit XML
        if: steps.unity_test.outcome == 'success'
        shell: pwsh
        run: >-
          ./Packages/com.buildsoft.motion-take-studio/Tools~/Run-MotionTakeStudioTests.ps1
          -ValidateResultsOnly
          -ValidationMode EditMode
          -ResultPath artifacts/editmode-results.xml

      - name: Validate PlayMode NUnit XML
        if: steps.unity_test.outcome == 'success'
        shell: pwsh
        run: >-
          ./Packages/com.buildsoft.motion-take-studio/Tools~/Run-MotionTakeStudioTests.ps1
          -ValidateResultsOnly
          -ValidationMode PlayMode
          -ResultPath artifacts/playmode-results.xml

      - name: Upload Unity Build Automation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-tests-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: Unity CI Gate
    if: always()
    needs:
      - contract
      - unity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require contract and Unity tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          UNITY_RESULT: ${{ needs.unity.result }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$CONTRACT_RESULT" != "success" || "$UNITY_RESULT" != "skipped" ]]; then
              echo "PR CI failed: contract=$CONTRACT_RESULT unity=$UNITY_RESULT"
              exit 1
            fi
            echo "PR CI contract passed; the credential-bearing UBA job remained skipped."
            exit 0
          fi
          if [[ "$CONTRACT_RESULT" != "success" || "$UNITY_RESULT" != "success" ]]; then
            echo "Unity CI failed: contract=$CONTRACT_RESULT unity=$UNITY_RESULT"
            exit 1
          fi
          echo "Unity CI passed."
