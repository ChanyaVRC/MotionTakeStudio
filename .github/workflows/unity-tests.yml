name: Unity Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    name: CI Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Test runner contract
        shell: pwsh
        run: >-
          ./Packages/com.buildsoft.motion-take-studio/Tools~/Run-MotionTakeStudioTests.ps1
          -SelfTest

      - name: Test workflow contract
        shell: pwsh
        run: >-
          ./Packages/com.buildsoft.motion-take-studio/Tools~/Tests/Test-UnityCiContract.ps1
          -RepositoryRoot .

      - name: Test credential-safe Docker arguments
        shell: bash
        run: bash ./.github/scripts/test-run-gameci-package-tests.sh

  # Dedicated Unity CI account credentials never reach pull-request code. This
  # lane runs only after a reviewed change lands on protected main, and again
  # before release.
  unity:
    name: Unity EditMode + PlayMode
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: contract
    concurrency:
      # One dedicated account/seat is shared by protected-main and release runs.
      group: motion-take-studio-unity-license
      # Let the in-flight job return its license before a newer job starts.
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment: unity-ci
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout pinned GameCI runner sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          repository: game-ci/unity-test-runner
          ref: 0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
          path: .gameci/unity-test-runner
          persist-credentials: false

      - name: Verify Unity license secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_LICENSE" || -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "Missing UNITY_LICENSE, UNITY_EMAIL, or UNITY_PASSWORD in the unity-ci environment."
            exit 1
          fi

      - name: Run package tests without VRChat SDK or NDMF
        id: unity_test
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GAMECI_ACTION_PATH: ${{ github.workspace }}/.gameci/unity-test-runner/dist
          UNITY_IMAGE: unityci/editor@sha256:1c7b9cf8a65a304bb99f222d91c3452f99148ad647d1416ed658a3908a9f8dea
          UNITY_VERSION: 2022.3.22f1
          PROJECT_PATH: Packages/com.buildsoft.motion-take-studio
          ARTIFACTS_PATH: artifacts
          PACKAGE_MODE: "true"
        run: bash ./.github/scripts/run-gameci-package-tests.sh

      - name: Validate EditMode NUnit XML
        if: steps.unity_test.outcome == 'success'
        shell: pwsh
        run: >-
          ./Packages/com.buildsoft.motion-take-studio/Tools~/Run-MotionTakeStudioTests.ps1
          -ValidateResultsOnly
          -ValidationMode EditMode
          -ResultPath artifacts/editmode-results.xml

      - name: Validate PlayMode NUnit XML
        if: steps.unity_test.outcome == 'success'
        shell: pwsh
        run: >-
          ./Packages/com.buildsoft.motion-take-studio/Tools~/Run-MotionTakeStudioTests.ps1
          -ValidateResultsOnly
          -ValidationMode PlayMode
          -ResultPath artifacts/playmode-results.xml

      - name: Upload Unity test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unity-tests-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: Unity CI Gate
    if: always()
    needs:
      - contract
      - unity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require contract and Unity tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONTRACT_RESULT: ${{ needs.contract.result }}
          UNITY_RESULT: ${{ needs.unity.result }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$CONTRACT_RESULT" != "success" || "$UNITY_RESULT" != "skipped" ]]; then
              echo "PR CI failed: contract=$CONTRACT_RESULT unity=$UNITY_RESULT"
              exit 1
            fi
            echo "PR CI contract passed; the secret-bearing Unity job remained skipped."
            exit 0
          fi
          if [[ "$CONTRACT_RESULT" != "success" || "$UNITY_RESULT" != "success" ]]; then
            echo "Unity CI failed: contract=$CONTRACT_RESULT unity=$UNITY_RESULT"
            exit 1
          fi
          echo "Unity CI passed."
